# Release workflow — builds and publishes binaries via GoReleaser.
#
# How to create a release:
#   1. Ensure all changes are merged to main and CI is green.
#   2. Tag the commit:  git tag v1.2.3
#   3. Push the tag:    git push origin v1.2.3
#   4. This workflow triggers automatically on the pushed tag,
#      builds cross-platform binaries, and creates a GitHub Release.
#
# The GoReleaser configuration lives in .goreleaser.yml at the repo root.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
